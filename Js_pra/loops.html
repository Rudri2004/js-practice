<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atm System</title>
</head>
<body>
    
    <script>
        let pin=1234;
        let balance=10000;
        let enterdpin=1234;
        let depositedamt=2000;
        let withdrawamt=3000;
        let choice=3;

        if(pin===enterdpin){

            document.write("Pin verified <br>");
            if(choice===1){
                 document.write("your balance amount is "+ balance+"<br>");
            }else if(choice===2){
                 let newamt=balance+depositedamt;
                document.write("Deposited amount is "+ depositedamt+"<br>");
                document.write("Your new balance is "+ newamt+"<br>");
            }
            else if(choice===3){
                if (withdrawamt <= balance) {
                    balance = balance - withdrawamt;

                    document.write("Your withdraw amount is " + withdrawamt + "<br>");
                    document.write("Your remaining balance is " + balance + "<br>");
                }
                else {
                    document.write("Insufficient balance");
                }
            }
            else if(choice===4){
                   document.write("Thank you for using the ATM");
            }
            else{
                 document.write("Invalid choice");
            }

        }

        else{
             document.write(" Incorrect pin");
        }
       
    </script>
</body>
</html>
