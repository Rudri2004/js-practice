<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Operators</h2>

<p id="result"></p>

<script>
    let a = 10;
    let b = 5;

    let addition = a + b;
    let subtraction = a - b;
    let multiplication = a * b;
    let division = a / b;
    let remainder = a % b;

    let isAdult = 22 >= 18;

    let message = isAdult ? "You are an Adult" : "You are a Minor";

    document.getElementById("result").innerHTML =
        "Addition: " + addition + "<br>" +
        "Subtraction: " + subtraction + "<br>" +
        "Multiplication: " + multiplication + "<br>" +
        "Division: " + division + "<br>" +
        "Remainder: " + remainder + "<br>" +
        message;
</script>

</body>
</html>
